// ============================================================
// READ SCREEN
// ============================================================
let currentPage = 0;

function buildReadScreen() {
  const nav = document.getElementById('section-nav');
  sections.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'section-btn' + (i === 0 ? ' active' : '');
    btn.textContent = `${s.page}`;
    btn.title = s.title;
    btn.onclick = () => { currentPage = i; renderPage(); };
    nav.appendChild(btn);
  });
  renderPage();
}

function renderPage() {
  const s = sections[currentPage];
  document.getElementById('page-title').textContent = `${s.title} (${s.page})`;
  const body = document.getElementById('page-body');
  body.innerHTML = '';
  s.sentences.forEach((sent, i) => {
    const p = document.createElement('p');
    p.innerHTML = `<span class="sent-num">${i+1}</span>${sent}`;
    body.appendChild(p);
  });
  document.getElementById('page-indicator').textContent = `${currentPage+1} / ${sections.length}`;
  document.getElementById('prev-btn').disabled = currentPage === 0;
  document.getElementById('next-btn').disabled = currentPage === sections.length - 1;
  document.querySelectorAll('.section-btn').forEach((b, i) => b.classList.toggle('active', i === currentPage));
}

function changePage(dir) {
  currentPage = Math.max(0, Math.min(sections.length - 1, currentPage + dir));
  renderPage();
}

// ============================================================
// QUIZ STATE
// ============================================================
let quizType = 'fill';
let quizItems = [];
let quizIdx = 0;
let score = 0;
let answered = false;
let orderSelected = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function setQuizType(type) {
  quizType = type;
  document.querySelectorAll('.qtype-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('qt-' + type).classList.add('active');
  startQuiz();
}

function startQuiz() {
  if (quizType === 'exam') {
    quizItems = shuffle(examQuestions);
  } else {
    quizItems = shuffle(allItems).slice(0, 15);
  }
  quizIdx = 0; score = 0; answered = false; orderSelected = [];
  renderQuiz();
}

function renderQuiz() {
  if (quizIdx >= quizItems.length) { showScore(); return; }
  answered = false;
  const item = quizItems[quizIdx];
  if (quizType === 'fill') renderFill(item);
  else if (quizType === 'order') renderOrder(item);
  else if (quizType === 'trans') renderTrans(item);
  else renderExam(item);
}

function progressHtml() {
  const total = quizItems.length;
  const pct = (quizIdx / total) * 100;
  return `<div class="quiz-progress">문제 ${quizIdx+1} / ${total} &nbsp;·&nbsp; 점수 ${score}<div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div></div>`;
}

// ── EXAM ──────────────────────────────────────────────────
function renderExam(item) {
  const typeLabel = {content:'내용 일치', blank:'빈칸 추론', vocab:'어휘', main:'주제', title:'제목', insert:'문장 삽입', order:'순서 배열', infer:'추론', grammar:'어법', trans:'영작'};
  const label = typeLabel[item.type] || item.type;

  let passageHtml = '';
  if (item.passage) passageHtml = `<div class="q-passage">${item.passage.replace(/\n/g,'<br>')}</div>`;

  const choicesHtml = item.choices.map((c, i) => {
    const nums = ['①','②','③','④','⑤'];
    return `<button class="choice-btn" onclick="checkExam(this,${i},${item.answer})">${nums[i]} ${c}</button>`;
  }).join('');

  document.getElementById('quiz-area').innerHTML = `
    ${progressHtml()}
    <div class="quiz-card">
      <div class="q-section-label">📝 ${label}</div>
      <div class="q-text">${item.q.replace(/\n/g,'<br>')}</div>
      ${passageHtml}
      <div class="choices">${choicesHtml}</div>
      <div class="feedback" id="feedback"></div>
      <button class="btn-next" id="btn-next" onclick="nextQuiz()">${quizIdx+1 < quizItems.length ? '다음 문제 →' : '결과 보기'}</button>
    </div>`;
}

function checkExam(btn, chosen, correct) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  if (chosen === correct) {
    btn.classList.add('correct');
    score++;
    showFeedback(true, quizItems[quizIdx].explanation);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.choice-btn')[correct].classList.add('correct');
    showFeedback(false, quizItems[quizIdx].explanation);
  }
  document.getElementById('btn-next').style.display = 'block';
}

// ── FILL ──────────────────────────────────────────────────
function getBlankTarget(sentence) {
  const words = sentence.split(' ');
  const candidates = words.map((w,i) => ({ raw:w, clean:w.replace(/[^a-zA-Z]/g,''), i })).filter(x => x.clean.length > 4);
  if (!candidates.length) { const i = Math.floor(words.length/2); return { raw:words[i], clean:words[i].replace(/[^a-zA-Z]/g,''), i }; }
  return shuffle(candidates)[0];
}

function renderFill(item) {
  const target = getBlankTarget(item.sentence);
  const display = item.sentence.split(' ').map((w,i) => i === target.i ? '<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>' : w).join(' ');
  const otherWords = allItems.filter(x=>x!==item).flatMap(x=>x.sentence.split(' ').map(w=>w.replace(/[^a-zA-Z]/g,''))).filter(w=>w.length>4&&w.toLowerCase()!==target.clean.toLowerCase());
  const wrongs = shuffle([...new Set(otherWords)]).slice(0,3);
  const choices = shuffle([target.clean,...wrongs]);
  const nums = ['①','②','③','④'];
  const choicesHtml = choices.map((c,i)=>`<button class="choice-btn" onclick="checkFill(this,'${c}','${target.clean}')">${nums[i]} ${c}</button>`).join('');
  document.getElementById('quiz-area').innerHTML = `
    ${progressHtml()}
    <div class="quiz-card">
      <div class="q-section-label">${item.section}</div>
      <div class="q-instruction">빈칸에 들어갈 알맞은 단어를 고르세요</div>
      <div class="q-text">${display}</div>
      <div class="choices">${choicesHtml}</div>
      <div class="feedback" id="feedback"></div>
      <button class="btn-next" id="btn-next" onclick="nextQuiz()">${quizIdx+1<quizItems.length?'다음 문제 →':'결과 보기'}</button>
    </div>`;
}

function checkFill(btn, chosen, correct) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  if (chosen.toLowerCase()===correct.toLowerCase()) { btn.classList.add('correct'); score++; showFeedback(true); }
  else { btn.classList.add('wrong'); document.querySelectorAll('.choice-btn').forEach(b=>{ if(b.textContent.trim().slice(2).toLowerCase()===correct.toLowerCase()) b.classList.add('correct'); }); showFeedback(false,`정답: ${correct}`); }
  document.getElementById('btn-next').style.display='block';
}

// ── ORDER ─────────────────────────────────────────────────
function renderOrder(item) {
  const words = item.sentence.split(' ');
  const shuffled = shuffle([...words]);
  orderSelected = [];
  const chipsHtml = shuffled.map((w,i)=>`<div class="chip" id="chip-${i}" data-word="${w}" data-i="${i}" onclick="addOrderWord(this)">${w}</div>`).join('');
  document.getElementById('quiz-area').innerHTML = `
    ${progressHtml()}
    <div class="quiz-card">
      <div class="q-section-label">${item.section}</div>
      <div class="q-instruction">단어를 순서대로 탭해서 문장을 완성하세요</div>
      <div class="answer-area" id="answer-area"></div>
      <div class="word-chips" id="word-chips">${chipsHtml}</div>
      <div class="btn-row"><button class="btn-check" onclick="checkOrder('${item.sentence.replace(/'/g,"\\'")}')">확인</button><button class="btn-clear" onclick="clearOrder()">지우기</button></div>
      <div class="feedback" id="feedback"></div>
      <button class="btn-next" id="btn-next" onclick="nextQuiz()">${quizIdx+1<quizItems.length?'다음 문제 →':'결과 보기'}</button>
    </div>`;
}

function addOrderWord(chip) {
  if (chip.classList.contains('used')) return;
  chip.classList.add('used');
  orderSelected.push({ word: chip.dataset.word, chipId: chip.id });
  const ac = document.createElement('div');
  ac.className = 'answer-chip';
  ac.textContent = chip.dataset.word;
  ac.onclick = () => { orderSelected = orderSelected.filter(x=>x.chipId!==chip.id); document.getElementById(chip.id).classList.remove('used'); ac.remove(); };
  document.getElementById('answer-area').appendChild(ac);
}

function clearOrder() {
  orderSelected = [];
  document.getElementById('answer-area').innerHTML = '';
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('used'));
}

function checkOrder(correct) {
  if (answered) return;
  answered = true;
  const userStr = orderSelected.map(x=>x.word).join(' ');
  const ok = userStr.trim()===correct.trim();
  document.querySelectorAll('.chip,.answer-chip').forEach(c=>c.style.pointerEvents='none');
  if (ok) { score++; showFeedback(true); } else { showFeedback(false,correct); }
  document.getElementById('btn-next').style.display='block';
}

// ── TRANS ─────────────────────────────────────────────────
function renderTrans(item) {
  const dir = Math.random()<0.5?'ko2en':'en2ko';
  const prompt = dir==='ko2en'?item.translation:item.sentence;
  const correct = dir==='ko2en'?item.sentence:item.translation;
  const others = allItems.filter(x=>x!==item);
  const wrongs = shuffle(others).slice(0,3).map(x=>dir==='ko2en'?x.sentence:x.translation);
  const choices = shuffle([correct,...wrongs]);
  const nums = ['①','②','③','④'];
  const choicesHtml = choices.map((c,i)=>{
    const e=c.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    const ce=correct.replace(/'/g,"\\'").replace(/"/g,'&quot;');
    return `<button class="choice-btn" onclick="checkTrans(this,'${e}','${ce}')">${nums[i]} ${c}</button>`;
  }).join('');
  document.getElementById('quiz-area').innerHTML = `
    ${progressHtml()}
    <div class="quiz-card">
      <div class="q-section-label">${item.section}</div>
      <div class="q-instruction">${dir==='ko2en'?'한국어를 영어로 번역한 것을 고르세요':'영어를 한국어로 번역한 것을 고르세요'}</div>
      <div class="q-text">${prompt}</div>
      <div class="choices">${choicesHtml}</div>
      <div class="feedback" id="feedback"></div>
      <button class="btn-next" id="btn-next" onclick="nextQuiz()">${quizIdx+1<quizItems.length?'다음 문제 →':'결과 보기'}</button>
    </div>`;
}

function checkTrans(btn, chosen, correct) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  if (chosen===correct) { btn.classList.add('correct'); score++; showFeedback(true); }
  else { btn.classList.add('wrong'); document.querySelectorAll('.choice-btn').forEach(b=>{ if(b.textContent.trim().slice(2)===correct) b.classList.add('correct'); }); showFeedback(false); }
  document.getElementById('btn-next').style.display='block';
}

// ── SHARED ────────────────────────────────────────────────
function showFeedback(correct, extra) {
  const fb = document.getElementById('feedback');
  if (correct) {
    fb.className = 'feedback correct';
    fb.innerHTML = '✓ 정답!' + (extra ? `<br><span style="font-size:0.82rem;opacity:0.85">${extra.replace(/\n/g,'<br>')}</span>` : '');
  } else {
    fb.className = 'feedback wrong';
    fb.innerHTML = '✗ 틀렸어요.' + (extra ? `<br><span style="font-size:0.82rem">${extra.replace(/\n/g,'<br>')}</span>` : '');
  }
}

function nextQuiz() { quizIdx++; renderQuiz(); }

function showScore() {
  const pct = Math.round((score/quizItems.length)*100);
  const msg = pct>=80?'훌륭해요! 🎉':pct>=60?'잘했어요! 💪':'조금 더 연습해 봐요 📚';
  document.getElementById('quiz-area').innerHTML = `
    <div class="score-display">
      <div class="big-score">${score}<span style="font-size:1.4rem;color:#aaa"> / ${quizItems.length}</span></div>
      <div class="score-label">${pct}점 — ${msg}</div>
      <button class="restart-btn" onclick="startQuiz()">다시 풀기 🔄</button>
    </div>`;
}

// ============================================================
// SCREEN SWITCH
// ============================================================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+name).classList.add('active');
  if (name==='quiz') startQuiz();
}

buildReadScreen();
</script>
